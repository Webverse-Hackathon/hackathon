name: ally

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ally
      POSTGRES_PASSWORD: ally
      POSTGRES_DB: ally
    ports:
      - '5432:5432'
    volumes:
      - ally-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ally']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://ally:ally@postgres:5432/ally
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - '4000:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://ally:ally@postgres:5432/ally
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ALLY_RECORDINGS_DIR: /recordings
      PLAYWRIGHT_HEADLESS: 'true'
    # Chromium crashes intermittently on the default 64MB of shared memory. See F-61.
    shm_size: 1gb
    volumes:
      - ally-recordings:/recordings
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 2g

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

  # The deliberately broken storefront the agent is demonstrated against.
  # Built with ALLY_SOURCE=1 so every JSX element carries data-ally-src.
  fixture:
    build:
      context: .
      dockerfile: infra/docker/fixture.Dockerfile
      args:
        ALLY_SOURCE: '1'
    ports:
      - '3100:3100'

volumes:
  ally-pg:
  ally-recordings:
